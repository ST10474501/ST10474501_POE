    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="logo">
        <span>TN</span>
        <div>
            <h1>TechNova</h1>
            <p>IT Solutions</p>
        </div>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="pricing.html">Pricing</a>
        <a href="faq.html">FAQ</a>
        <a href="contact.html">Contact</a>
        <a href="enquiry.html" class="nav-button">Enquire Now</a>
    </nav>

<section class="page-hero">
    <p class="welcome">LET'S WORK TOGETHER</p>
    <h2>Make an Enquiry</h2>
    <p>Tell us what technology solution you need.</p>
</section>

<section class="enquiry-section">

    <form class="enquiry-form">

        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email address" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter your phone number" required>

        <label>Company Name</label>
        <input type="text" placeholder="Enter your company name">

        <label>Service Required</label>

        <select required>
            <option value="">Select a service</option>
            <option>IT Support</option>
            <option>Cybersecurity</option>
            <option>Cloud Solutions</option>
            <option>Web Development</option>
            <option>Network Solutions</option>
            <option>Data Backup</option>
        </select>

        <label>Message</label>

        <textarea rows="7"
            placeholder="Tell us about your requirements..."
            required></textarea>

        <button type="submit" class="button">Submit Enquiry</button>

    </form>

</section>

<footer>
    <h2>TechNova IT Solutions</h2>
    <p>Your trusted partner in innovative IT solutions.</p>

</footer>
